<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Mapa 3D - Energia Medianeira PR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <style>
    body { margin: 0; background: #111; color: #fff; font-family: sans-serif; }
    #map { position: fixed; inset: 0; width: 100vw; height: 100vh; }
    #status { position: fixed; top: 10px; left: 10px; z-index: 999; background: rgba(0,0,0,0.85); padding: 8px 12px; border-radius: 6px; font-size: 13px; border: 1px solid #333; }
  </style>
</head>
<body>
  <div id="status">Iniciando mapa de Medianeira...</div>
  <div id="map"></div>

  <script>
    const statusEl = document.getElementById('status');
    const cdnBase = 'https://' + 'unpkg.com' + '/maplibre-gl@4.7.1/dist/';

    const linkCss = document.createElement('link');
    linkCss.rel = 'stylesheet';
    linkCss.href = cdnBase + 'maplibre-gl.css';
    document.head.appendChild(linkCss);

    const scriptJs = document.createElement('script');
    scriptJs.src = cdnBase + 'maplibre-gl.js';
    scriptJs.onload = iniciarMapa;
    scriptJs.onerror = () => { statusEl.innerText = 'Erro de rede ao baixar MapLibre.'; };
    document.head.appendChild(scriptJs);

    function iniciarMapa() {
      const tileDark = 'https://' + 'a.basemaps.cartocdn.com' + '/dark_all/{z}/{x}/{y}.png';
      const tile3d = 'https://' + 'tiles.openfreemap.org' + '/planet';

      const map = new maplibregl.Map({
        container: 'map',
        style: {
          version: 8,
          sources: {
            'osm': { type: 'raster', tiles: [tileDark], tileSize: 256 },
            'openmaptiles': { type: 'vector', url: tile3d }
          },
          layers: [
            { id: 'fundo-escuro', type: 'raster', source: 'osm' },
            {
              id: 'predios-3d',
              source: 'openmaptiles',
              'source-layer': 'building',
              type: 'fill-extrusion',
              minzoom: 14,
              paint: {
                'fill-extrusion-color': '#34495e',
                'fill-extrusion-height': ['coalesce', ['get', 'render_height'], 12],
                'fill-extrusion-base': ['coalesce', ['get', 'render_min_height'], 0],
                'fill-extrusion-opacity': 0.85
              }
            }
          ]
        },
        center: [-54.0942, -25.2953],
        zoom: 15.5,
        pitch: 60,
        bearing: -20
      });

      map.addControl(new maplibregl.NavigationControl());

      map.on('load', () => {
        statusEl.innerText = 'Medianeira - PR (3D Ativo)';
        new maplibregl.Marker({ color: '#ff3b30' })
          .setLngLat([-54.0942, -25.2953])
          .setPopup(new maplibregl.Popup().setHTML('<b>Alerta:</b> Falta de luz aqui'))
          .addTo(map);
      });
    }
  </script>
</body>
</html>
