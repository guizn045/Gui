<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Mapa 3D - Energia Medianeira PR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <script src="https://jsdelivr.net"></script>
  <link href="https://jsdelivr.net" rel="stylesheet" />
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #111; overflow: hidden; }
    #map { position: fixed; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="map"></div>

  <script>
    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://openfreemap.org',
      center: [-54.0942, -25.2953],
      zoom: 15.5,
      pitch: 60,
      bearing: -20,
      antialias: true
    });

    map.addControl(new maplibregl.NavigationControl());

    map.on('load', () => {
      new maplibregl.Marker({ color: '#ff3b30' })
        .setLngLat([-54.0942, -25.2953])
        .setPopup(new maplibregl.Popup().setHTML('<b>Alerta:</b> Falta de luz reportada aqui'))
        .addTo(map);
    });
  </script>
</body>
</html>
