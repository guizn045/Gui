<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Mapa 3D - Energia Medianeira PR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://unpkg.com"></script>
  <link href="https://unpkg.com" rel="stylesheet" />
  <style>
    body { margin: 0; background: #111; color: #fff; font-family: sans-serif; }
    #map { position: fixed; inset: 0; width: 100vw; height: 100vh; }
    #status { position: fixed; top: 10px; left: 10px; z-index: 999; background: rgba(0,0,0,0.8); padding: 8px 12px; border-radius: 6px; font-size: 13px; }
  </style>
</head>
<body>
  <div id="status">Carregando mapa de Medianeira...</div>
  <div id="map"></div>

  <script>
    const statusEl = document.getElementById('status');

    try {
      if (typeof maplibregl === 'undefined') {
        statusEl.innerText = 'Erro: Biblioteca MapLibre não carregou (link cortado).';
      } else {
        const map = new maplibregl.Map({
          container: 'map',
          style: {
            version: 8,
            sources: {
              'osm': {
                type: 'raster',
                tiles: ['https://cartocdn.com{z}/{x}/{y}.png'],
                tileSize: 256
              },
              'openmaptiles': {
                type: 'vector',
                url: 'https://openfreemap.org'
              }
            },
            layers: [
              { id: 'fundo-escuro', type: 'raster', source: 'osm' },
              {
                id: 'predios-3d',
                source: 'openmaptiles',
                'source-layer': 'building',
                type: 'fill-extrusion',
                minzoom: 14,
                paint: {
                  'fill-extrusion-color': '#2c3e50',
                  'fill-extrusion-height': ['coalesce', ['get', 'render_height'], 10],
                  'fill-extrusion-base': ['coalesce', ['get', 'render_min_height'], 0],
                  'fill-extrusion-opacity': 0.85
                }
              }
            ]
          },
          center: [-54.0942, -25.2953],
          zoom: 15.5,
          pitch: 60,
          bearing: -20
        });

        map.on('load', () => {
          statusEl.innerText = 'Medianeira - PR (3D Ativo)';
          new maplibregl.Marker({ color: '#ff3b30' })
            .setLngLat([-54.0942, -25.2953])
            .addTo(map);
        });

        map.on('error', (e) => {
          statusEl.innerText = 'Aviso no mapa: ' + (e.error ? e.error.message : 'erro de rede');
        });
      }
    } catch (err) {
      statusEl.innerText = 'Falha: ' + err.message;
    }
  </script>
</body>
</html>
