<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Mapa 3D - Energia Medianeira PR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Biblioteca MapLibre GL JS (Gratuita e Open Source) -->
  <script src="https://unpkg.com"></script>
  <link href="https://unpkg.com" rel="stylesheet" />
  <style>
    body { margin: 0; padding: 0; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; }
  </style>
</head>
<body>
  <div id="map"></div>

  <script>
    const map = new maplibregl.Map({
      container: 'map',
      // Estilo gratuito com prédios 3D já configurados (OpenFreeMap)
      style: 'https://openfreemap.org',
      // Coordenadas do centro de Medianeira - PR
      center: [-54.0942, -25.2953],
      zoom: 15.5,
      pitch: 60, // Inclinação da câmera para ver em 3D
      bearing: -20, // Rotação do mapa
      antialias: true
    });

    // Adiciona controles de zoom e rotação 3D
    map.addControl(new maplibregl.NavigationControl());

    // Exemplo: Marcador simulando um alerta de falta de luz
    map.on('load', () => {
      new maplibregl.Marker({ color: '#ff3b30' })
        .setLngLat([-54.0942, -25.2953])
        .setPopup(new maplibregl.Popup().setHTML('<b>Alerta:</b> Falta de luz reportada aqui'))
        .addTo(map);
    });
  </script>
</body>
</html>
