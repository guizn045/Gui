<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Mapa 3D - Energia Medianeira PR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://unpkg.com"></script>
  <link href="https://unpkg.com" rel="stylesheet" />
  <style>
    body { margin: 0; background: #111; }
    #map { position: fixed; inset: 0; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://openfreemap.org',
      center: [-54.0942, -25.2953],
      zoom: 15.5,
      pitch: 60,
      bearing: -20
    });
    new maplibregl.Marker({ color: '#ff3b30' })
      .setLngLat([-54.0942, -25.2953])
      .addTo(map);
  </script>
</body>
</html>
